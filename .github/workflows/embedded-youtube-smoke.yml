name: Embedded YouTube single-APK smoke
on:
  workflow_dispatch:
  push:
    branches: ['codex/embedded-gms-prototype']
permissions:
  contents: read
  actions: read
concurrency:
  group: embedded-youtube-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Temporary runner-only replay. The candidate is immutable and no app
      # source differs from its build commit; restore the full build after diagnosis.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: embedded-youtube-candidate
          run-id: 38259086887
          github-token: ${{ github.token }}
          path: build/embedded-youtube
      - name: Verify exact candidate and unchanged runtime sources
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          output = Path('build/embedded-youtube')
          report = json.loads((output / 'build-report.json').read_text())
          expected = '0b3ca92a51506544b1c1e025522353d08e71ff67937ce20b0c1b5881654a2e7e'
          with (output / report['apk']).open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected or actual != report['apkSha256']:
              raise RuntimeError('Replay candidate identity mismatch')
          if not report['debugSigning'] or not report['instrumentationIncluded'] or report['productionRelease']:
              raise RuntimeError('Replay requires a disposable instrumented build')
          for name, expected_hash in report['sourceHashes'].items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected_hash:
                  raise RuntimeError('Runtime source changed since candidate build: ' + name)
          (output / 'replay-provenance.json').write_text(json.dumps({
              'candidateRun': 38259086887,
              'candidateCommit': '0daefe6e343f3c01de659dee10a7a825c85c1604',
              'candidateSha256': actual,
          }, indent=2) + '\n')
          PYCODE
      - name: Share the exact test APK and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: embedded-youtube-candidate
          # Never upload the disposable keystore or the build work directory.
          path: |
            build/embedded-youtube/*-embedded-EXPERIMENTAL.apk
            build/embedded-youtube/replay-provenance.json
            build/embedded-youtube/build-report.json
            build/embedded-youtube/adapted-gmscore.report.json
            build/embedded-youtube/work/embedded-res/host-registration-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  android:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download this run's immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: embedded-youtube-candidate
          path: build/embedded-youtube
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise actual YouTube without external microG
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          output = Path('build/embedded-youtube')
          report = json.loads((output / 'build-report.json').read_text())
          if not report['debugSigning'] or not report['instrumentationIncluded'] or report['productionRelease']:
              raise RuntimeError('CI requires an instrumented, disposable test build')
          apk = output / report['apk']
          with apk.open('rb') as stream:
              if hashlib.file_digest(stream, 'sha256').hexdigest() != report['apkSha256']:
                  raise RuntimeError('Candidate differs from its immutable build report')
          command = ['python3', 'experiments/embedded-gms/run-youtube-smoke.py',
                     '--api', '${{ matrix.api }}', '--apk', str(apk),
                     '--output-dir', str(output / 'evidence'), '--diagnostic-stacks']
          if '${{ matrix.api }}' == '34':
              command.append('--disable-official-gms')
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: embedded-youtube-api-${{ matrix.api }}
          path: |
            build/embedded-youtube/evidence/
            build/embedded-youtube/replay-provenance.json
            build/embedded-youtube/build-report.json
            build/embedded-youtube/adapted-gmscore.report.json
            build/embedded-youtube/work/embedded-res/host-registration-report.json
          retention-days: 7
