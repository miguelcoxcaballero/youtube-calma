<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://raw.githubusercontent.com https://api.github.com; img-src data:; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Actualizar YouTube Calma</title><link rel="stylesheet" href="android-update.css">
<style>
:root{color-scheme:light dark;--bg-secondary:#f8f6f1;--text-primary:#262626;--text-secondary:#737373;--border:#dbdbdb;--border-strong:#bdbdbd;--accent-read:#3c7755;--accent-read-soft:#e6efe7;--accent-read-border:#bfd3c1;--ihr-safe-top:24px;--f-body:system-ui,sans-serif;--f-logo:system-ui,sans-serif;--r-full:999px;--ease:ease}
@media(prefers-color-scheme:dark){:root{--bg-secondary:#121212;--text-primary:#f5f5f5;--text-secondary:#a8a8a8;--border:#363636;--border-strong:#555;--accent-read:#8fbf9e;--accent-read-soft:#20342a;--accent-read-border:#385a42}}
body{margin:0;background:var(--bg-secondary);color:var(--text-primary);font:16px/1.6 var(--f-body)}main{padding:32px 24px}button{padding:12px 20px;border-radius:12px;border:0;background:var(--text-primary);color:var(--bg-secondary);font:inherit}#check-status{color:var(--text-secondary)}
</style></head><body><main data-inhouse-update-screen data-render-count="0"><h1>Actualizar</h1><p id="check-status" role="status">Buscando actualizaciones…</p><button id="check" type="button">Buscar actualizaciones</button><p>Android te pedirá confirmar la instalación. Tus datos y tu sesión se conservan.</p></main>
<script src="updater.js"></script><script>
const quiet=new URLSearchParams(location.search).get('quiet')==='1';
const button=document.getElementById('check'),message=document.getElementById('check-status');
let pending='';try{pending=window.InhouseNative?.getPendingUpdateManifest?.() || '';}catch(_){}
if(quiet || pending){document.querySelector('main').hidden=true;document.body.style.background='transparent';}
async function check(){button.disabled=true;message.textContent='Buscando actualizaciones…';const found=await InhouseUpdater.offerAvailableAndroidUpdate();button.disabled=false;message.textContent=found?'Actualización disponible.':window.__inhouseUpdateCheckVerified?'Estás en la última versión disponible.':'No se pudo comprobar. Reintenta.';}
if(quiet){new MutationObserver(()=>{if(document.getElementById('android-update-gate') && window.InhouseUpdateHost && window.__inhouseAvailableUpdate)window.InhouseUpdateHost.offer(JSON.stringify(window.__inhouseAvailableUpdate));}).observe(document.body,{childList:true,subtree:true});}
if(pending){
  window.handleInhouseUpdateResult=InhouseUpdater.handleInhouseUpdateResult;
  try{const manifest=InhouseUpdater.validateManifest(JSON.parse(pending)),installed=InhouseUpdater.getInstalledAndroidAppVersion();if(InhouseUpdater.shouldOfferUpdate(manifest,installed))InhouseUpdater.showUpdateGate(manifest,installed);}catch(_){document.querySelector('main').hidden=false;check();}
}else{
  InhouseUpdater.initAndroidUpdateChecks();
  if(!quiet)check();
}
button.onclick=check;
</script></body></html>
